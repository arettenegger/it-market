name: Build & Publish (Hostinger via GitHub)

# Baut die Vite-Seite und legt das FERTIGE Ergebnis (Inhalt von dist/)
# in den Branch "hostinger". Genau diesen Branch verbindest du in Hostinger
# (hPanel -> Git). Hostinger klont/aktualisiert dann die fertigen Dateien
# direkt nach public_html – ohne selbst bauen zu müssen.
#
# Läuft automatisch bei jedem Push auf main – und manuell über "Run workflow".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Der Workflow-Token muss in den hostinger-Branch schreiben dürfen
permissions:
  contents: write

concurrency:
  group: hostinger-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Produktions-Build erstellen
        run: bun run build

      - name: Fertigen Build in Branch "hostinger" veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger
          # Immer ein sauberer Einzel-Commit (keine wachsende Historie im Deploy-Branch)
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy (fertiger Build) ${{ github.sha }}'
